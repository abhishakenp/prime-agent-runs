name: C2-Outer Recursion Probe
on:
  workflow_dispatch:

jobs:
  outer-job:
    runs-on: ubuntu-latest
    steps:
      - name: Capture outer run info
        id: info
        run: |
          echo "outer_run_id=${github.run_id}" >> $GITHUB_OUTPUT
          echo "outer_run_number=${github.run_number}" >> $GITHUB_OUTPUT
          echo "::notice::Outer Run ID: ${github.run_id}"
          echo "::notice::Outer Run Number: ${github.run_number}"

      - name: Dispatch inner workflow via API
        id: trigger
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            // Trigger the inner workflow (c2-inner.yml) via workflow_dispatch
            await github.rest.actions.createWorkflowDispatch({
              owner: 'abhishakenp',
              repo: 'prime-agent-runs',
              workflow_id: 'c2-inner.yml',
              ref: 'probe/recursion',
              inputs: {
                outer_run_id: String(context.runId),
                outer_run_number: String(context.runNumber)
              }
            });
            console.log('Inner workflow dispatched.');

            // Poll until the inner run appears
            for (let i = 0; i < 20; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: 'abhishakenp',
                repo: 'prime-agent-runs',
                workflow_id: 'c2-inner.yml',
                head_branch: 'probe/recursion',
                per_page: 1
              });
              if (runs.data.workflow_runs.length > 0) {
                const r = runs.data.workflow_runs[0];
                core.setOutput('inner_run_id', String(r.id));
                core.setOutput('inner_run_number', String(r.run_number));
                core.setOutput('inner_run_url', r.html_url);
                console.log('Inner run detected:', r.id, r.status, r.conclusion);
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }

      - name: Wait for inner run to complete
        run: |
          INNER_ID=${{ steps.trigger.outputs.inner_run_id }}
          echo "Polling inner run ID: $INNER_ID"
          for i in $(seq 1 20); do
            RESULT=$(gh api repos/abhishakenp/prime-agent-runs/actions/runs/$INNER_ID --jq '.conclusion // "in_progress"' 2>/dev/null)
            echo "Check $i: $RESULT"
            if [ "$RESULT" != "in_progress" ]; then
              echo "Inner run finished: $RESULT"
              break
            fi
            sleep 5
          done

      - name: Download inner run artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-c2-inner-${github.run_id}
          path: downloaded/
          if-no-files-found: error

      - name: Show results
        run: |
          echo "=========================================="
          echo "OUTER RUN ID: ${{ github.run_id }}"
          echo "OUTER RUN NUMBER: ${{ github.run_number }}"
          echo "INNER RUN ID: ${{ steps.trigger.outputs.inner_run_id }}"
          echo "INNER RUN NUMBER: ${{ steps.trigger.outputs.inner_run_number }}"
          echo "INNER RUN URL: ${{ steps.trigger.outputs.inner_run_url }}"
          echo "=========================================="
          echo ""
          echo "Artifact contents:"
          cat downloaded/result.txt
