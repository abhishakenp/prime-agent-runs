name: RLM
run-name: "${{ github.event.inputs.task_name || 'rlm-agent' }}"
on:
  workflow_dispatch:
    inputs:
      task_name:
        description: 'Display name shown in the Actions run list'
        required: false
        default: 'rlm-agent'
      agent_id:
        description: 'Agent ID'
        required: true
      gist_url:
        description: 'Bundle Gist URL'
        required: true
      work_dir:
        description: 'Work directory relative to HOME'
        required: true
        default: '.rlm/sessions/fleet/unspecified'
      resume_from:
        description: 'Prior run id whose work-dir artifact is restored (migration)'
        required: false
        default: ''
      generation:
        description: 'Self-migration generation counter'
        required: false
        default: '0'
      runner_label:
        description: 'runs-on label — keeps this file generic per OS family'
        required: false
        default: 'macos-14'

jobs:
  agent:
    runs-on: ${{ github.event.inputs.runner_label || 'macos-14' }}
    env:
      AGENT_ID: ${{ github.event.inputs.agent_id }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      LM_STUDIO_API_KEY: ${{ secrets.LM_STUDIO_API_KEY }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    timeout-minutes: 65
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Download and Extract Agent Bundle
        run: |
          curl -sL "${{ github.event.inputs.gist_url }}" -o /tmp/bundle.b64
          if base64 -d /tmp/bundle.b64 > /tmp/bundle.tar.gz 2>/dev/null; then true; else base64 -D -i /tmp/bundle.b64 -o /tmp/bundle.tar.gz; fi
          mkdir -p /tmp/agent-bundle
          tar xzf /tmp/bundle.tar.gz -C /tmp/agent-bundle
          BUNDLE_DIR=$(ls /tmp/agent-bundle)
          echo "BUNDLE_DIR=/tmp/agent-bundle/$BUNDLE_DIR" >> $GITHUB_ENV
          mkdir -p $BUNDLE_DIR/agent
          BUNDLE_DIR=$BUNDLE_DIR node -e 'const fs=require("fs");const keys=["GH_TOKEN","GITHUB_TOKEN","AI_GATEWAY_API_KEY","ANTHROPIC_API_KEY","ANTHROPIC_OAUTH_TOKEN","AWS_ACCESS_KEY_ID","AWS_BEARER_TOKEN_BEDROCK","AWS_SECRET_ACCESS_KEY","AWS_SESSION_TOKEN","AZURE_OPENAI_API_KEY","CEREBRAS_API_KEY","CLOUDFLARE_API_KEY","CLOUDFLARE_API_TOKEN","DASHSCOPE_API_KEY","DEEPSEEK_API_KEY","EXPLABS_API_KEY","FIRECRAWL_API_KEY","FIREWORKS_API_KEY","GEMINI_API_KEY","GOOGLE_CLOUD_API_KEY","GROQ_API_KEY","KAGGLE_API_TOKEN","KIMI_API_KEY","LM_STUDIO_API_KEY","MIMO_API_KEY","MINIMAX_API_KEY","MISTRAL_API_KEY","MOONSHOT_API_KEY","OLLAMA_API_KEY","OPENAI_API_KEY","OPENCODE_API_KEY","OPENROUTER_API_KEY","PRIME_API_KEY","SERPER_API_KEY","TYPESAFE_API_KEY","XAI_API_KEY","XIAOMI_API_KEY","ZAI_API_KEY"];const env={};for(const k of keys){env[k]=process.env[k]||"";}fs.writeFileSync(process.env.BUNDLE_DIR+"/agent/env.json",JSON.stringify(env,null,2));'
          cat >> "$BUNDLE_DIR/agent/prompt.txt" <<'RELAYEOF'
          === FLEET RELAY CONTRACT ===
          This run is hosted on repo $RLM_FLEET_REPO. If the repository your PR must
          target is not writable by the account running you (it may be a private repo
          owned by the fleet head — try the push once; a 403/404 means no access),
          then instead: push your finished branch to THIS run's repo
          (git push https://x-access-token:$GH_TOKEN@github.com/$RLM_FLEET_REPO HEAD:<branch>),
          and write RELAY_REQUEST.json into your session work directory (your cwd) containing
          {"branch":"<branch>","target_repo":"<owner/repo>","base":"<base>","title":"<pr title>","body":"<pr body>","task":"<task name>"}.
          The fleet head fetches the branch and files the PR itself. Never fail the
          task just because the push to the target was denied — relay it.
          
          === FINDINGS CHANNEL ===
          Your task is tracked as an issue on the head repo. To post to it —
          findings, verdicts, evidence notes, status — append one JSON string per
          line to findings/ISSUE_COMMENTS.jsonl inside your session work dir
          (mkdir -p findings first). Each line becomes a real issue comment.
          To comment on a PR or issue somewhere the head can reach, make the
          line {"body":"<markdown>","to":"<owner/repo>#<number>" or the full URL}.
          Put screenshots/videos/logs in findings/ too — they upload as a small
          separate artifact the head links from the issue. Always include the
          run URL in PR-bound bodies so the evidence is one click away:
          https://github.com/$RLM_FLEET_REPO/actions/runs/$GITHUB_RUN_ID
          RELAYEOF

      - name: Resume Work Directory
        if: github.event.inputs.resume_from != ''
        run: |
          mkdir -p "$HOME/${{ github.event.inputs.work_dir }}" /tmp/rlm-resume
          gh run download "${{ github.event.inputs.resume_from }}" -R "${{ github.repository }}" -n "agent-work-${{ github.event.inputs.resume_from }}" -D /tmp/rlm-resume || echo "[rlm] resume artifact unavailable — continuing fresh"
          cp -a /tmp/rlm-resume/. "$HOME/${{ github.event.inputs.work_dir }}/"
          echo "[rlm] resumed work dir from run ${{ github.event.inputs.resume_from }} (generation ${{ github.event.inputs.generation || '0' }})"
          printf '\n\n=== RESUMED MISSION (generation %s) ===\nYou are continuing a mission that outlived its previous CI runner generation %s. The work directory was restored — check git status/log, prior notes, and completed artifacts FIRST, then continue to completion. Do not restart finished work.\n' "${{ github.event.inputs.generation || '0' }}" "${{ github.event.inputs.generation || '0' }}" >> "$BUNDLE_DIR/agent/prompt.txt"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Delete Predecessor Run Record
        if: github.event.inputs.resume_from != ''
        run: |
          curl -sf -X DELETE -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.inputs.resume_from }}" \
            && echo "[rlm] deleted predecessor run ${{ github.event.inputs.resume_from }}" \
            || echo "[rlm] predecessor delete skipped (already gone or no perm)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run Agent
        run: |
          mkdir -p "$HOME/${{ github.event.inputs.work_dir }}" && date +%s > "$HOME/${{ github.event.inputs.work_dir }}/.agent-started"
          mkdir -p "$HOME/${{ github.event.inputs.work_dir }}/clones"
          for d in mk repo project work app clone codebase src checkout; do
            if [ ! -d "$HOME/$d" ] && [ ! -L "$HOME/$d" ]; then ln -s "$HOME/${{ github.event.inputs.work_dir }}/clones/$d" "$HOME/$d"; fi
          done
          bash $BUNDLE_DIR/run.sh
        env:
          AGENT_ID: ${{ github.event.inputs.agent_id }}
          RLM_GEN_BUDGET: '3300'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RLM_FLEET_REPO: ${{ github.repository }}

      - name: Find Work Directory
        if: always()
        id: workdir
        run: |
          echo "work_path=$HOME/${{ github.event.inputs.work_dir }}" >> $GITHUB_OUTPUT

      - name: Dump Remote Logs
        if: always()
        run: |
          W=${{ steps.workdir.outputs.work_path }}
          for f in status.json stack.env output.log omniroute.log provisioner.log run.stdout.log; do
            if [ -f "$W/$f" ]; then echo "===== $f ====="; tail -c 6000 "$W/$f"; echo; fi
          done

      - name: Upload Work Directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-work-${{ github.run_id }}
          path: |
            ${{ steps.workdir.outputs.work_path }}/
            !${{ steps.workdir.outputs.work_path }}/**/node_modules/
          if-no-files-found: ignore

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: |
            /tmp/agent-bundle/
          if-no-files-found: ignore

      - name: Upload Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-findings-${{ github.run_id }}
          path: |
            ${{ steps.workdir.outputs.work_path }}/findings/
          if-no-files-found: ignore

      - name: Dispatch Successor Generation
        if: always() && !cancelled()
        run: |
          W=${{ steps.workdir.outputs.work_path }}
          GEN="${{ github.event.inputs.generation || '0' }}"
          DONE=""; grep -q '"status":"done"' "$W/status.json" 2>/dev/null && [ -s "$W/output.log" ] && DONE=1
          START=$(cat "$W/.agent-started" 2>/dev/null || date +%s); ELAPSED=$(( $(date +%s) - START ))
          if [ "$GEN" -lt 8 ] && { [ -f "$W/.budget-exceeded" ] || { [ -z "$DONE" ] && [ "$ELAPSED" -gt 180 ]; }; }; then
            RESUME_VAL="${{ github.run_id }}"
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rlm-agent-macos.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"task_name\":\"${{ github.event.inputs.task_name || 'rlm-agent' }}\",\"agent_id\":\"${{ github.event.inputs.agent_id }}\",\"gist_url\":\"${{ github.event.inputs.gist_url }}\",\"work_dir\":\"${{ github.event.inputs.work_dir }}\",\"resume_from\":\"$RESUME_VAL\",\"generation\":\"$((GEN+1))\",\"runner_label\":\"${{ github.event.inputs.runner_label || 'macos-14' }}\"}}" \
              || echo '[rlm] successor dispatch failed'
            echo "[rlm] gen $GEN handing off (budget=$([ -f "$W/.budget-exceeded" ] && echo yes || echo no), resume=$RESUME_VAL) — dispatched gen $((GEN+1))"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
