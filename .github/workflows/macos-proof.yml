name: macos-proof
# Builds mergekit-gpui on a real macOS runner, launches the app, drives
# scripted keyboard input, and records the screen — the video/screenshot
# artifact IS the behavioral proof for UI PRs (implementer logs are not).
# Dispatch inputs: ref (branch/PR head ref), proof_name, drive (key plan).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/ref of LivioGama/mergekit-gpui to build
        required: true
      proof_name:
        description: Artifact name slug
        required: false
        default: proof
      drive:
        description: Keystroke plan — text to type then backspace count, e.g. "mergekitproof|8"
        required: false
        default: "mergekitproof|12"

jobs:
  proof:
    runs-on: macos-14
    timeout-minutes: 170
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      RUST_BACKTRACE: "0"
    steps:
      - name: Checkout mergekit
        uses: actions/checkout@v4
        with:
          repository: LivioGama/mergekit-gpui
          ref: ${{ inputs.ref }}

      - name: Rust toolchain + Metal toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ inputs.ref }}
          restore-keys: |
            mk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mk-${{ runner.os }}-

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release -p mergekit-gpui 2>&1 | tail -25

      - name: Bundle app
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/bundle-macos.sh 2>&1 | tail -15
          ls -la target/release/bundle/ || true

      - name: Launch + AX-dump + drive + record
        run: |
          APP="target/release/bundle/MergeKit.app"
          BIN="$APP/Contents/MacOS/mergekit-gpui"
          OUT=/tmp/mk-proof; mkdir -p "$OUT"
          TEXT="${{ inputs.drive }}"; TYPE="${TEXT%%|*}"; BK="${TEXT##*|}"
          set +e
          brew install cliclick >/dev/null 2>&1 || true

          # MERGEKIT_REPO env opens the checked-out repo directly — skips the picker.
          MERGEKIT_REPO="$GITHUB_WORKSPACE" "$BIN" >"$OUT/app.log" 2>&1 &
          APPPID=$!
          echo "[proof] launched pid=$APPPID with MERGEKIT_REPO=$GITHUB_WORKSPACE"
          sleep 30
          screencapture -x "$OUT/shot-0-launch.png"; echo "[proof] launch shot rc=$?"

          # AX discovery: what does GPUI expose? Decides AX-drive vs cliclick-drive.
          # Single-line osascript with ¬ continuations avoided — write script file first.
          cat > "$OUT/axdump.scpt" <<'SCPT'
          set out to ""
          tell application "System Events"
            tell process "mergekit-gpui"
              try
                set out to "windows=" & (count of windows) & "\n"
              on error e
                set out to "no windows: " & e
              end try
              repeat with w in windows
                try
                  set out to out & "WINDOW " & (title of w) & " size " & ((size of w) as string) & "\n"
                end try
                try
                  set ui to entire contents of w
                  set n to count of ui
                  set out to out & "elements=" & n & "\n"
                  repeat with i from 1 to (my min2(n, 400))
                    set el to item i of ui
                    try
                      set out to out & "  " & (role of el) & " | " & ((description of el) as string) & " | " & ((value of el) as string) & " | " & ((position of el) as string) & " " & ((size of el) as string) & "\n"
                    end try
                  end repeat
                on error e2
                  set out to out & "contents err: " & e2 & "\n"
                end try
              end repeat
            end tell
          end tell
          return out
          on min2(a, b)
            if a < b then return a
            return b
          end min2
          SCPT
          osascript "$OUT/axdump.scpt" > "$OUT/ax-dump.txt" 2>&1
          head -60 "$OUT/ax-dump.txt"

          # Drive attempt 1 — AX: press+focus first text field if GPUI exposes one.
          cat > "$OUT/axdrive.scpt" <<'SCPT'
          tell application "System Events" to tell process "mergekit-gpui"
            try
              set tf to first text field of window 1
              set focused of tf to true
              perform action "AXPress" of tf
              return "AX field focused"
            on error e
              return "AX drive failed: " & e
            end try
          end tell
          SCPT
          osascript "$OUT/axdrive.scpt" 2>&1 | head -5

          echo "[proof] starting 90s screen recording"
          screencapture -v "$OUT/proof.mov" -V 90 &
          REC=$!
          sleep 6

          # Drive attempt 2 — cliclick + keystrokes (coords relative to a typical
          # 1470x956 runner desktop; the History view search field sits near top-left
          # of the app window; refine from shot-0 on re-runs).
          X=${DRIVE_X:-325}; Y=${DRIVE_Y:-60}
          cliclick c:$X,$Y w:800 || true
          osascript -e "tell application \"System Events\" to keystroke \"$TYPE\"" 2>&1 | head -3
          sleep 1.5
          screencapture -x "$OUT/shot-2-typed.png"

          for i in $(seq 1 "$BK"); do
            osascript -e 'tell application "System Events" to key code 51' 2>/dev/null || true
            sleep 0.3
          done
          screencapture -x "$OUT/shot-3-after-backspace.png"

          # Second field probe via Tab
          osascript -e 'tell application "System Events" to key code 48' 2>/dev/null || true
          sleep 1
          osascript -e 'tell application "System Events" to keystroke "secondfieldprobe"' 2>&1 | head -3
          sleep 1
          for i in $(seq 1 17); do
            osascript -e 'tell application "System Events" to key code 51' 2>/dev/null || true
            sleep 0.3
          done
          screencapture -x "$OUT/shot-4-second-field.png"

          wait $REC || true
          kill $APPPID 2>/dev/null || true
          ls -la "$OUT"
          for f in "$OUT"/*.mov; do [ -f "$f" ] && sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null || true; done

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk-proof-${{ inputs.proof_name }}-${{ github.run_id }}
          path: /tmp/mk-proof/
          retention-days: 14
          if-no-files-found: warn
