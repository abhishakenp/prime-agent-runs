name: C2-Inner Recursion Probe
on:
  workflow_dispatch:
    inputs:
      outer_run_id:
        required: false
        type: string
        description: "Outer workflow run ID"
      outer_run_number:
        required: false
        type: string
  workflow_call:
    inputs:
      outer_run_id:
        required: true
        type: string
      outer_run_number:
        required: true
        type: string

jobs:
  nested:
    runs-on: ubuntu-latest
    steps:
      - name: Create result file
        run: |
          echo "nested" > result.txt
          echo "Outer Run ID: ${{ inputs.outer_run_id }}" >> result.txt
          echo "Inner Run ID: ${{ github.run_id }}" >> result.txt
          echo "Inner Run Number: ${{ github.run_number }}" >> result.txt
          cat result.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-c2-inner-${{ inputs.outer_run_id }}
          path: result.txt
          retention-days: 5
