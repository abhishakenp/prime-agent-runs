name: C2 Outer Probe - Recursion
on:
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Test message'
        required: false
        default: 'C2 recursion probe'

jobs:
  dispatch-inner:
    runs-on: ubuntu-latest
    outputs:
      outer_run_id: ${{ steps.info.outputs.run_id }}
      artifact_name: ${{ steps.info.outputs.artifact_name }}
    steps:
      - name: Generate tracking info
        id: info
        run: |
          echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "artifact_name=nested-result-${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "outer_run_id=${{ github.run_id }}"
          echo "outer_artifact_name=nested-result-${{ github.run_id }}"

      - name: Dispatch inner workflow
        run: |
          echo "=== Dispatching inner workflow ==="
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probe-recursion-inner.yml/dispatches" \
            -d '{"ref":"probe/recursion","inputs":{"outer_run_id":"${{ github.run_id }}"}}'
          echo "Inner workflow dispatched"

      - name: Wait for inner workflow
        run: |
          echo "=== Waiting for inner workflow to complete ==="
          for i in $(seq 1 24); do
            STATUS=$(curl -s -X GET \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probe-recursion-inner.yml/runs?per_page=1" | \
              node -e 'const d=require("fs").readFileSync("/dev/stdin","utf8");try{const j=JSON.parse(d);console.log(j.workflow_runs&&j.workflow_runs[0]?j.workflow_runs[0].status:"unknown");}catch(e){console.log("error");}')
            echo "Poll $i: Inner workflow status = $STATUS"
            if [ "$STATUS" = "completed" ]; then
              echo "Inner workflow completed!"
              break
            fi
            sleep 5
          done

      - name: Download inner artifact
        run: |
          echo "=== Downloading inner artifact ==="
          INNER_RUN=$(curl -s -X GET \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probe-recursion-inner.yml/runs?per_page=1" | \
            node -e 'const d=require("fs").readFileSync("/dev/stdin","utf8");try{const j=JSON.parse(d);const r=j.workflow_runs&&j.workflow_runs[0];if(r){console.log(r.id);}else{console.log("");}}catch(e){console.log("");}')
          
          if [ -z "$INNER_RUN" ]; then
            echo "ERROR: Could not find inner workflow run"
            exit 1
          fi
          
          echo "Inner workflow run ID: $INNER_RUN"
          
          mkdir -p inner-result
          gh run download $INNER_RUN -n "nested-result-*" -D inner-result 2>&1 || true
          
          if [ ! -f inner-result/result.txt ]; then
            ARTIFACT_ID=$(curl -s -X GET \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$INNER_RUN/artifacts" | \
              node -e 'const d=require("fs").readFileSync("/dev/stdin","utf8");try{const j=JSON.parse(d);if(j.artifacts&&j.artifacts.length>0){console.log(j.artifacts[0].id);}else{console.log("");}}catch(e){console.log("");}')
            
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Artifact ID: $ARTIFACT_ID"
              curl -s -L -o inner-result/artifact.zip \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip"
              unzip -o inner-result/artifact.zip -d inner-result/ 2>/dev/null || true
            fi
          fi
          
          echo "=== Contents of inner-result directory ==="
          ls -la inner-result/ 2>/dev/null || echo "No files downloaded"
          cat inner-result/result.txt 2>/dev/null || echo "No result.txt found"

      - name: Summary
        run: |
          echo ""
          echo "=== C2 RECURSION PROBE RESULTS ==="
          echo "Outer Run ID: ${{ github.run_id }}"
          echo "Outer Artifact Name: outer-result-${{ github.run_id }}"
          echo "Inner workflow was triggered via workflow_dispatch API"
          echo "==============================="
