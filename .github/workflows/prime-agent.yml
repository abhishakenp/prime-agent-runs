name: Prime Agent
on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent ID'
        required: true
      gist_url:
        description: 'Bundle Gist URL'
        required: true
      work_dir:
        description: 'Work directory relative to HOME'
        required: true
        default: 'sandbox-omniroute-fallback-test'

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      AGENT_ID: ${{ github.event.inputs.agent_id }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and Extract Agent Bundle
        run: |
          curl -sL "${{ github.event.inputs.gist_url }}" -o /tmp/bundle.b64
          base64 -d /tmp/bundle.b64 > /tmp/bundle.tar.gz
          mkdir -p /tmp/agent-bundle
          tar xzf /tmp/bundle.tar.gz -C /tmp/agent-bundle
          BUNDLE_DIR=$(ls /tmp/agent-bundle)
          echo "BUNDLE_DIR=/tmp/agent-bundle/$BUNDLE_DIR" >> $GITHUB_ENV
          mkdir -p $BUNDLE_DIR/agent
          BUNDLE_DIR=$BUNDLE_DIR node -e 'const fs=require("fs");const keys=["DEEPSEEK_API_KEY","OLLAMA_API_KEY","OPENROUTER_API_KEY","FIRECRAWL_API_KEY","CLAUDE_CODE_OAUTH_TOKEN","OPENCODE_API_KEY","GEMINI_API_KEY","MIMO_API_KEY","HF_TOKEN","DASHSCOPE_API_KEY"];const env={};for(const k of keys){env[k]=process.env[k]||"";}fs.writeFileSync(process.env.BUNDLE_DIR+"/agent/env.json",JSON.stringify(env,null,2));'

      - name: Run Agent
        run: |
          bash $BUNDLE_DIR/run.sh
        env:
          AGENT_ID: ${{ github.event.inputs.agent_id }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: Find Work Directory
        if: always()
        id: workdir
        run: |
          echo "work_path=$HOME/sandbox-omniroute-fallback-test" >> $GITHUB_OUTPUT

      - name: Upload Work Directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-work-${{ github.run_id }}
          path: ${{ steps.workdir.outputs.work_path }}/
          if-no-files-found: ignore

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: |
            /tmp/agent-bundle/
          if-no-files-found: ignore
