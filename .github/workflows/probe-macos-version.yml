name: Probe macOS Version

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Run system commands
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo ""
          echo "=== uname -a ==="
          uname -a
          echo ""
          echo "=== xcode-select -p ==="
          xcode-select -p
          echo ""
          echo "=== xcodebuild -version ==="
          xcodebuild -version
