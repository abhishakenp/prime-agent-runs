name: RLM
on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent ID'
        required: true
      gist_url:
        description: 'Bundle Gist URL'
        required: true
      work_dir:
        description: 'Work directory relative to HOME'
        required: true
        default: '.rlm/sessions/fleet/be7e2253-fa92-4968-9b12-ce98b86f8b53'
      resume_from:
        description: 'Prior run id whose work-dir artifact is restored (migration)'
        required: false
        default: ''
      generation:
        description: 'Self-migration generation counter'
        required: false
        default: '0'

jobs:
  agent:
    runs-on: "ubuntu-latest"
    env:
      AGENT_ID: ${{ github.event.inputs.agent_id }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and Extract Agent Bundle
        run: |
          curl -sL "${{ github.event.inputs.gist_url }}" -o /tmp/bundle.b64
          if base64 -d /tmp/bundle.b64 > /tmp/bundle.tar.gz 2>/dev/null; then true; else base64 -D -i /tmp/bundle.b64 -o /tmp/bundle.tar.gz; fi
          mkdir -p /tmp/agent-bundle
          tar xzf /tmp/bundle.tar.gz -C /tmp/agent-bundle
          BUNDLE_DIR=$(ls /tmp/agent-bundle)
          echo "BUNDLE_DIR=/tmp/agent-bundle/$BUNDLE_DIR" >> $GITHUB_ENV
          mkdir -p $BUNDLE_DIR/agent
          BUNDLE_DIR=$BUNDLE_DIR node -e 'const fs=require("fs");const keys=["GH_TOKEN"];const env={};for(const k of keys){env[k]=process.env[k]||"";}fs.writeFileSync(process.env.BUNDLE_DIR+"/agent/env.json",JSON.stringify(env,null,2));'

      - name: Run Agent
        run: |
          bash $BUNDLE_DIR/run.sh
        env:
          AGENT_ID: ${{ github.event.inputs.agent_id }}
          RESUME_FROM: ${{ github.event.inputs.resume_from }}
          RLM_GHA_REPO: ${{ github.repository }}
          RLM_GHA_RUN_ID: ${{ github.run_id }}
          RLM_GHA_REF: ${{ github.ref_name }}
          RLM_GHA_GENERATION: ${{ github.event.inputs.generation || '0' }}
          RLM_GHA_GIST_URL: ${{ github.event.inputs.gist_url }}
          RLM_WORK_DIR_INPUT: ${{ github.event.inputs.work_dir }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Find Work Directory
        if: always()
        id: workdir
        run: |
          echo "work_path=$HOME/.rlm/sessions/fleet/be7e2253-fa92-4968-9b12-ce98b86f8b53" >> $GITHUB_OUTPUT

      - name: Upload Work Directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-work-${{ github.run_id }}
          path: ${{ steps.workdir.outputs.work_path }}/
          if-no-files-found: ignore

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: |
            /tmp/agent-bundle/
          if-no-files-found: ignore
